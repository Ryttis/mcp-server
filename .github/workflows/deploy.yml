name: CI/CD - MCP Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy to Ubuntu via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p /var/www
            cd /var/www

            if [ ! -d mcp-protocol/.git ]; then
              git clone https://github.com/Ryttis/mcp-protocol.git mcp-protocol
            else
              cd /var/www/mcp-protocol
              git pull origin main
            fi

            cd /var/www/mcp-protocol
            npm install

            cd /var/www

            if [ ! -d mcp-server/.git ]; then
              git clone https://github.com/Ryttis/mcp-server.git mcp-server
            else
              cd /var/www/mcp-server
              git pull origin main
            fi

            cd /var/www/mcp-server
            npm install
            npm install ../mcp-protocol

            pm2 restart mcp-server || pm2 start server.js --name mcp-server --interpreter node
            pm2 save
            pm2 status